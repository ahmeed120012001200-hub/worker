<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>ملخص اليوم — production-worker</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
	<header style="margin-bottom:12px;">
		<h2 style="margin:0">صفحة حفظ ملخص اليوم</h2>
		<p style="margin:4px 0 12px 0;color:#556">اختر تاريخاً ثم احسب ملخص اليوم من السجلات، ثم احفظه ليستعمل في التقارير الشهرية</p>
	</header>

	<div style="max-width:900px;">
		<div style="display:flex; gap:8px; align-items:center; margin-bottom:8px;">
			<label>تاريخ:
				<input id="ds_date" type="date" />
			</label>
			<button id="ds_compute">احسب من السجلات</button>
			<button id="ds_save" disabled>احفظ ملخص اليوم</button>
			<button id="ds_clear">مسح الملخص المحفوظ لهذا اليوم</button>
			<a href="index.html" style="margin-inline-start:12px;">العودة</a>
		</div>

		<div id="ds_result">
			<table id="ds_table" style="width:100%;border-collapse:collapse; display:none;">
				<thead>
					<tr>
						<th style="text-align:right;padding:8px;border-bottom:1px solid #eef2f6">رقم العامل</th>
						<th style="text-align:right;padding:8px;border-bottom:1px solid #eef2f6">اسم العامل</th>
						<th style="text-align:right;padding:8px;border-bottom:1px solid #eef2f6">الكمية</th>
					</tr>
				</thead>
				<tbody></tbody>
			</table>
		</div>

		<h3 style="margin-top:18px">الملخصات اليومية المحفوظة</h3>
		<ul id="ds_list" style="padding-inline-start:18px;"></ul>
	</div>

<script src="daily-summary.js"></script>
</body>
</html>
